<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Custom Components</title>
    </head>
    <body>
        <div id="drawer-root"></div>
        <div id="dropdown-root"></div>
        <div id="modal-root"></div>
        <div id="notification-root">
            <div id="topLeft" class="fixed max-h-screen overglow-x-visible overflow-y-auto w-110 flex flex-col gap-y-2 items-center scrollbar-none left-5 top-5"></div>
            <div id="top" class="fixed max-h-screen overglow-x-visible overflow-y-auto w-110 flex flex-col gap-y-2 items-center scrollbar-none left-1/2 top-5 -translate-x-1/2"></div>
            <div id="topRight" class="fixed max-h-screen overglow-x-visible overflow-y-auto w-110 flex flex-col gap-y-2 items-center scrollbar-none right-5 top-5"></div>
            <div id="bottomLeft" class="fixed max-h-screen overglow-x-visible overflow-y-auto w-110 flex flex-col gap-y-2 items-center scrollbar-none left-5 bottom-5"></div>
            <div id="bottom" class="fixed max-h-screen overglow-x-visible overflow-y-auto w-110 flex flex-col gap-y-2 items-center scrollbar-none left-1/2 bottom-5 -translate-x-1/2"></div>
            <div id="bottomRight" class="fixed max-h-screen overglow-x-visible overflow-y-auto w-110 flex flex-col gap-y-2 items-center scrollbar-none right-5 bottom-5"></div>
        </div>
        <div id="root"></div>
        <script type="module" src="/src/main"></script>
    </body>
</html>
